<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERTALE</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: monospace; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,.85); text-align: center; gap: 12px; font-size: 16px; }
  #status { position: absolute; z-index: 1; left: 0; right: 0; bottom: 8px; text-align: center; color: #888; font-size: 13px; pointer-events: none; }
  #errors { position: absolute; left: 4px; top: 4px; max-width: 60%; display: none; background: rgba(80,0,0,.8); color: #fdd; font-size: 11px; padding: 4px; pointer-events: none; }
  #saves { margin-top: 18px; font-size: 13px; }
  #saves button { font-size: 13px; padding: 4px 10px; margin: 0 4px; border-color: #888; color: #ccc; }
  #saves button:hover { border-color: #fff; color: #fff; }
  #saveMsg { margin-top: 8px; min-height: 1.2em; color: #aaa; max-width: 420px; }
  button { font: inherit; background: #000; color: #fff; border: 2px solid #fff; padding: 6px 14px; cursor: pointer; }
</style>
<script>
  // Settings. assetBase is where the "undertale-master" folder lives, relative to this page.
  window.UT_CONFIG = { assetBase: 'undertale-master/', showErrors: /[?&]errors/.test(location.search), autostart: /[?&]autostart/.test(location.search), seed: Number((/[?&]seed=(\d+)/.exec(location.search) || [])[1]) || 0 };
</script>
<script src="data/game_data.js"></script>
<script src="data/game_code.js"></script>
<script src="engine/runtime.js"></script>
<script src="engine/draw.js"></script>
<script src="engine/input.js"></script>
<script src="engine/touch.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/storage.js"></script>
<script src="engine/paths.js"></script>
<script src="engine/builtins.js"></script>
<script src="engine/main.js"></script>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="start" class="overlay"><div>UNDERTALE</div><div style="color:#aaa">Click or press any key to start</div>
      <div style="color:#777;font-size:12px;max-width:420px">Z / Enter = confirm &nbsp; X / Shift = cancel &nbsp; C / Ctrl = menu &nbsp; arrows = move<br>F4 = fullscreen &nbsp; hold Esc = quit</div>
      <div id="saves"><button id="saveExport" type="button">Export save</button> <button id="saveImport" type="button">Import save</button>
        <input id="saveFile" type="file" accept=".json,application/json" style="display:none"><div id="saveMsg"></div></div></div>
    <div id="ended" class="overlay"><div>The game has closed.</div><button onclick="UT.restartFromEnded()">Start again</button></div>
    <div id="errors"></div>
  </div>
</div>
<div id="status">Loading...</div>
</body>
</html>
